<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI & Empathy App 2026 — Foodle Noodle</title>
<link rel="icon" href="foodle-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#3C672E;--green2:#4A7545;--lime:#92D050;--chart:#6BA77A;--ink:#24402A;--muted:#5B7360;--line:#E6EFE7;--sage:#F5F8F5;--mint2:#C4E8CF;--butter:#FFF3C7;--rose:#FBDADA;--pink:#FFDDE8;--pink2:#FFC6D9;--pinkink:#A83E68;--bad:#C0453F;--ok:#2E8B57;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:#FBFDFB;color:var(--ink);font-family:'Prompt',system-ui,sans-serif;font-weight:300;line-height:1.5}
b,strong{font-weight:500}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3,.kanit{font-family:'Kanit',system-ui,sans-serif}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 210px 22px 26px;background:linear-gradient(120deg,#F4FBF6 0%,#fff 55%,#FFF5F8 100%);border:1px solid var(--line);box-shadow:0 4px 18px rgba(36,64,42,.05)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(196,232,207,.35)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,198,217,.25)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;position:relative;z-index:1;flex-wrap:wrap}
.brand img{width:56px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 4px 12px rgba(60,103,46,.12)}
.chip{padding:4px 12px;border-radius:999px;background:#fff;color:var(--pinkink);font-weight:500;font-size:12px;letter-spacing:.5px;box-shadow:0 2px 8px rgba(60,103,46,.08)}
.userbox{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.hero h1{font-weight:600;font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1.15;color:#2F5427;margin:0;position:relative;z-index:1}
.hero .sub{color:#4E6B52;font-size:13px;margin:4px 0 0;position:relative;z-index:1}
.take{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:14px;font-size:15px}
.take b{color:#2F5427}
.mascot{position:absolute;right:26px;top:50%;margin-top:-80px;width:160px;height:160px;border-radius:50%;background:#F7FBF8;border:1px solid var(--line);display:grid;place-items:center;z-index:1;box-shadow:0 6px 18px rgba(36,64,42,.08)}
.mascot svg{width:128px}
.mascot span{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--pink2);color:var(--pinkink);font-family:'Kanit';font-weight:500;font-size:12px;padding:3px 12px;border-radius:999px}
@media (prefers-reduced-motion:no-preference){.mascot svg{animation:bob 3.2s ease-in-out infinite}.steam{animation:steam 2.4s ease-in-out infinite}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes steam{0%,100%{opacity:.35}50%{opacity:.9}}
@media (max-width:760px){.hero{padding:20px}.mascot{position:relative;right:auto;top:auto;margin:16px 0 6px;width:110px;height:110px}.mascot svg{width:88px}}
.tabs{display:flex;flex-wrap:wrap;background:var(--sage);border:1px solid var(--line);border-radius:999px;padding:5px;gap:4px;width:fit-content;max-width:100%}
.tab{background:none;border:1px solid transparent;border-radius:999px;padding:9px 18px;font:inherit;font-family:'Kanit';color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:#2F5427;font-weight:500;border-color:var(--line);box-shadow:0 2px 8px rgba(36,64,42,.08)}
.badge{display:inline-block;min-width:18px;margin-left:4px;padding:0 6px;border-radius:999px;background:#F7B3C8;color:#7A2448;font-size:11px;line-height:18px;text-align:center}
.panel{display:flex;flex-direction:column;gap:26px}
.panel[hidden]{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;box-shadow:0 2px 10px rgba(36,64,42,.04)}
.card::before{content:"";position:absolute;left:20px;top:0;width:48px;height:5px;border-radius:0 0 4px 4px;background:#9FD6AE}
.card:nth-child(2)::before{background:#A9D3F2}.card:nth-child(3)::before{background:#F7B3C8}.card:nth-child(4)::before{background:#C9BDF2}
.card h3{margin:0;font-weight:500;font-size:15px}
.win,.note{color:#55695A;font-size:12px}
.big{font-family:'Kanit';font-weight:600;color:#2F5427;font-size:2.3rem;line-height:1.2;margin-top:6px}
.good{color:var(--ok)}.badc{color:var(--bad)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-weight:500;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:8px;height:8px;border-radius:50%;background:#F29DB9;flex:none}
.desc{color:var(--muted);font-size:12px;margin:0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--sage);color:#2F5427;font-family:'Kanit';font-weight:500;padding:10px;text-align:left;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.heat td.c,.heat th.c{text-align:center;min-width:46px}
.heat td.c{border-radius:10px;border:3px solid #fff}
.l4{background:#CDEBD5}.l3{background:#EAF5DF}.l2{background:#FFF1C9}.l1{background:#FADADA}.l0{color:#9AA79C}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:6px;vertical-align:-2px;margin-right:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px}
.chart{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;position:relative;min-height:260px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:#6B7B6E;font-size:11px;font-family:'Prompt'}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#55695A}
input,select,textarea{font:inherit;font-size:13px;border:1px solid #DCE7DD;border-radius:10px;padding:7px 9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pink2);border-color:#E886A8}
textarea{min-height:64px;resize:vertical;width:100%}
.btn{font:inherit;font-family:'Kanit';font-weight:500;border-radius:999px;background:var(--green);border:1px solid var(--green);color:#fff;padding:9px 24px;cursor:pointer;box-shadow:0 6px 16px rgba(60,103,46,.22)}
.btn2{font:inherit;font-size:12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:4px 12px;cursor:pointer;margin:0 4px 4px 0}
.btn2:hover:not(:disabled){background:var(--pink);border-color:#E886A8}
button:disabled{opacity:.45;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(60,103,46,.06)}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#55695A}
.wide{grid-column:1/-1}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.msg{font-size:13px}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
.st-wait{background:var(--butter);color:#7A5B00;border-radius:999px}
.st-yes{background:var(--mint2);border-radius:999px}
.st-no{background:var(--rose);color:#8A2F2B;border-radius:999px}
.empty{color:#8A988C;font-size:13px;padding:14px 10px}
.notice{background:var(--butter);color:#5E4A00;border-radius:14px;padding:10px 14px;font-size:13px}
.cheer{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#F7FBF8;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.cheer svg{width:200px;max-width:100%;background:#fff;border-radius:16px}
.cheer p{margin:0;flex:1;min-width:200px;font-size:15px}
.cheer strong{font-family:'Kanit';color:#2F5427;font-size:1.1rem;display:block}
.rules{margin:0;padding-left:1.2rem;font-size:13px;line-height:1.8}
details{background:#F7FBF8;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font-size:13px}
summary{cursor:pointer;font-weight:500}
.login{max-width:440px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;text-align:center;box-shadow:0 10px 30px rgba(36,64,42,.08)}
.login img{width:80px}
.login input{width:100%;margin:14px 0;font-size:15px;padding:10px 12px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.1);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;z-index:5}
.loading{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="loading">กำลังโหลด…</div></div>

<script>
const SUPABASE_URL = 'https://yfmjbcdvrzvpilkqtouv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KBAG7qQFmSyelhtGTLyPQg_maoIU93F';
const YEAR = 2026;
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const STATUSES = ['ได้คะแนน','N/A','ไม่มีรายงาน','รอข้อมูล'];
const HELP_TYPES = [['ช่วยงานในแผนก',1],['ช่วยงานข้ามแผนก',2],['ช่วยแก้ปัญหาด่วน/คุณภาพ/ความปลอดภัย',3]];
const HELP_DEPTS = ['วางแผน/ผลิต','QA/QC','คลังสินค้า','วิศวกรรม/ซ่อมบำรุง','ซัพพลายเชน/จัดซื้อ','ฝ่ายขาย/แอดมินขาย','R&D','HR','บัญชี'];
const ROLES = {viewer:'ดูอย่างเดียว', editor:'หัวหน้าแผนก (กรอก/ยืนยัน)', hr:'HR (อนุมัติ KPI)', admin:'ผู้ดูแลระบบ'};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = {me: null, master: [], scores: [], sales: [], help: [], audit: [], users: [], tab: 'kpi', emonth: null};

// ---------- tiny DOM helper (textContent only, never innerHTML for data) ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const svgNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, text) { const el = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v); if (text != null) el.textContent = text; return el; }
const lvl = (v) => v == null ? 'l0' : v >= 4 ? 'l4' : v >= 3 ? 'l3' : v >= 2 ? 'l2' : 'l1';
const can = (...roles) => S.me && roles.includes(S.me.role);
const fmtM = (v) => (v / 1e6).toFixed(2) + ' ลบ.';
function errText(e) { return (e && (e.message || e.error_description)) || String(e); }

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  S.uid = session.user.id;
  const { data: me, error } = await sb.rpc('whoami');
  if (error) return renderLogin('เชื่อมต่อไม่สำเร็จ: ' + errText(error));
  if (!me || !me.role) return renderNoAccess(session.user.email);
  S.me = me;
  await loadAll();
  render();
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !S.me) boot(); if (ev === 'SIGNED_OUT') { S.me = null; renderLogin(); } });

function renderLogin(msg) {
  const email = h('input', {type: 'email', placeholder: 'อีเมลบริษัท เช่น name@foodlenoodle.com', autocomplete: 'email'});
  const out = h('p', {class: 'msg'}, msg || '');
  const btn = h('button', {class: 'btn', onclick: async () => {
    const v = email.value.trim(); if (!v) return;
    btn.disabled = true; out.className = 'msg'; out.textContent = 'กำลังส่งลิงก์…';
    const { error } = await sb.auth.signInWithOtp({ email: v, options: { emailRedirectTo: location.origin + location.pathname } });
    btn.disabled = false;
    if (error) { out.className = 'msg err'; out.textContent = 'ส่งไม่สำเร็จ: ' + errText(error); }
    else { out.className = 'msg ok'; out.textContent = 'ส่งลิงก์เข้าสู่ระบบไปที่อีเมลแล้ว เปิดอีเมลแล้วกดลิงก์เพื่อเข้าใช้งาน'; }
  }}, 'ส่งลิงก์เข้าสู่ระบบ');
  root().replaceChildren(h('div', {class: 'login'},
    h('img', {src: 'foodle-logo.png', alt: 'Foodle Noodle'}),
    h('h2', {}, 'KPI & Empathy App 2026'),
    h('p', {class: 'desc'}, 'เข้าสู่ระบบด้วยอีเมลที่ผู้ดูแลระบบเพิ่มไว้ ระบบจะส่งลิงก์เข้าใช้งานไปที่อีเมล ไม่ต้องใช้รหัสผ่าน'),
    email, btn, out));
}
function renderNoAccess(email) {
  root().replaceChildren(h('div', {class: 'login'},
    h('img', {src: 'foodle-logo.png', alt: 'Foodle Noodle'}),
    h('h2', {}, 'ยังไม่มีสิทธิ์เข้าใช้งาน'),
    h('p', {}, 'อีเมล ', h('b', {}, email), ' ยังไม่อยู่ในรายชื่อผู้ใช้ กรุณาแจ้งผู้ดูแลระบบให้เพิ่มสิทธิ์'),
    h('button', {class: 'btn2', onclick: () => sb.auth.signOut()}, 'ออกจากระบบ')));
}
const root = () => document.getElementById('root');

// ---------- data ----------
async function loadAll() {
  const q = await Promise.all([
    sb.from('kpi_master').select('*').order('sort'),
    sb.from('kpi_scores').select('*').eq('year', YEAR),
    sb.from('sales_monthly').select('*').eq('year', YEAR).order('month_no'),
    sb.from('help_log').select('*').order('date', {ascending: false}).limit(2000),
    sb.from('kpi_audit').select('*').order('at', {ascending: false}).limit(30),
    can('admin') ? sb.from('app_users').select('*').order('email') : Promise.resolve({data: []})
  ]);
  const bad = q.find((r) => r.error); if (bad) throw bad.error;
  [S.master, S.scores, S.sales, S.help, S.audit, S.users] = q.map((r) => r.data || []);
}
const approved = () => S.scores.filter((r) => r.state === 'อนุมัติ');
const scored = (rows) => rows.filter((r) => r.status === 'ได้คะแนน' && r.score != null);
const masterOf = (id) => S.master.find((m) => m.kpi_id === id) || {};
const avg = (rows) => rows.length ? rows.reduce((a, r) => a + +r.score, 0) / rows.length : null;
const r2 = (v) => v == null ? null : Math.round(v * 100) / 100;

function summary() {
  const ap = approved().map((r) => ({...r, dept: masterOf(r.kpi_id).dept, kpi: masterOf(r.kpi_id).kpi}));
  const sc = scored(ap);
  const lm = sc.length ? Math.max(...sc.map((r) => r.month_no)) : null;
  const cur = sc.filter((r) => r.month_no === lm), prev = sc.filter((r) => r.month_no === lm - 1);
  const byDept = d3group(cur, (r) => r.dept);
  const ds = [...byDept].map(([d, rows]) => ({d, a: avg(rows)})).sort((a, b) => b.a - a.a);
  const ytd = S.sales.filter((r) => r.actual_baht != null).reduce((a, r) => a + +r.actual_baht, 0);
  const salesLast = Math.max(0, ...S.sales.filter((r) => r.actual_baht != null).map((r) => r.month_no));
  const depts = [...new Set(S.master.map((m) => m.dept))];
  return {ap, lm, c: r2(avg(cur)), p: r2(avg(prev)), reported: byDept.size, deptsTotal: depts.length,
    top: ds[0] && ds[0].d, low: ds.length ? ds[ds.length - 1].d : null,
    below: cur.filter((r) => r.score < 3).length,
    missing: lm ? S.master.length - ap.filter((r) => r.month_no === lm && r.status !== 'ไม่มีรายงาน' && r.status !== 'รอข้อมูล').length : 0,
    ytd, salesLast, ytdPct: Math.round(ytd / 45000000 * 1000) / 10};
}
function d3group(arr, f) { const m = new Map(); for (const x of arr) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

// ---------- layout ----------
function render() {
  const sm = summary();
  const pendKpi = S.scores.filter((r) => r.state === 'รอ HR ตรวจ').length;
  const pendHelp = S.help.filter((r) => r.status === 'รอยืนยัน').length;
  const tabs = [['kpi', 'Dashboard KPI', 0], ['entry', 'กรอก KPI / HR อนุมัติ', pendKpi], ['help', 'บันทึกช่วยเพื่อน / Empathy', pendHelp]];
  if (can('admin')) tabs.push(['users', 'ผู้ใช้งาน', 0]);
  const chg = sm.c != null && sm.p != null ? r2(sm.c - sm.p) : null;
  const chgTxt = chg == null ? '—' : (chg > 0 ? '+' : '') + chg.toFixed(2);
  const chgCls = chg > 0 ? 'good' : chg < 0 ? 'badc' : '';
  const lmName = sm.lm ? MONTHS[sm.lm - 1] + ' ' + YEAR : '—';
  root().replaceChildren(
    h('header', {class: 'hero'},
      h('div', {class: 'brand'}, h('img', {src: 'foodle-logo.png', alt: 'Foodle Noodle'}), h('span', {class: 'chip'}, 'KPI · EMPATHY · 2026'),
        h('div', {class: 'userbox'}, S.me.name + ' · ' + ROLES[S.me.role], h('button', {class: 'btn2', onclick: refresh}, 'รีเฟรช'), h('button', {class: 'btn2', onclick: () => sb.auth.signOut()}, 'ออกจากระบบ'))),
      h('h1', {}, 'KPI & Empathy App 2026 — Foodle Noodle'),
      h('p', {class: 'sub'}, 'คะแนน KPI รายแผนก (เต็ม 5) · ข้อมูลจริงจากฐานข้อมูลบริษัท อัปเดตทันทีที่ HR อนุมัติ'),
      h('p', {class: 'take'}, 'เดือน ', h('b', {}, lmName), ' คะแนนเฉลี่ยทั้งบริษัท ', h('b', {}, sm.c != null ? sm.c.toFixed(2) : '—'), ' จาก 5 (',
        h('span', {class: chgCls}, chgTxt), ' จากเดือนก่อน) จาก ', h('b', {}, sm.reported + '/' + sm.deptsTotal), ' แผนกที่มีคะแนน · สูงสุด ', h('b', {}, sm.top || '—'),
        ' · ต่ำสุด ', h('b', {}, sm.low || '—'), ' · ยอดขายสะสม ', h('b', {}, sm.ytdPct.toFixed(1) + '%'), ' ของเป้าทั้งปี 45 ล้านบาท'),
      mascot()),
    h('nav', {class: 'tabs', role: 'tablist'}, tabs.map(([id, label, n]) => h('button', {class: 'tab', role: 'tab', 'aria-selected': String(S.tab === id), onclick: () => { S.tab = id; render(); history.replaceState(null, '', '#' + id); }}, label, n ? h('span', {class: 'badge'}, n) : null))),
    S.tab === 'kpi' ? panelKpi(sm) : S.tab === 'entry' ? panelEntry() : S.tab === 'help' ? panelHelp() : panelUsers(),
    h('details', {}, h('summary', {}, 'วิธีคิดคะแนน'), h('ul', {class: 'rules'},

// ---------- Help log / Empathy ----------
function empathyRows() {
  const pts = Object.fromEntries(HELP_TYPES);
  const rows = S.help.filter((r) => r.status === 'ยืนยัน').sort((a, b) => a.date.localeCompare(b.date) || a.recorded_at.localeCompare(b.recorded_at));
  const pair = new Map(), people = new Map();
  for (const r of rows) {
    const m = r.date.slice(0, 7), pk = m + '|' + r.helper + '>' + r.receiver;
    if (r.helper === r.receiver) continue;
    pair.set(pk, (pair.get(pk) || 0) + 1); if (pair.get(pk) > 2) continue;
    const k = r.helper + '|' + m;
    if (!people.has(k)) people.set(k, {person: r.helper, dept: r.helper_dept || '', month: m, count: 0, points: 0});
    const p = people.get(k); p.count++; p.points += pts[r.help_type] || 0;
  }
  return [...people.values()].map((p) => ({...p, bonus: Math.min(p.points, 5)})).sort((a, b) => b.month.localeCompare(a.month) || b.points - a.points);
}
